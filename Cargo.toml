[workspace]
resolver = "2"
members = ["packages/*"]
# The app template is copied out by scripts/new-app.sh, never built in place.
exclude = ["template"]

[workspace.package]
version = "0.0.6"
edition = "2021"
authors = ["Baptiste Grosjean <grosjeanbaptiste@outlook.com>"]
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
# Follow the newest stable Dioxus release and keep all consumers on that release.
dioxus = { version = "*", default-features = false, features = ["html", "macro", "signals", "hooks"] }
dioxus-ssr = "*"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
